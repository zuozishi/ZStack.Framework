name: templates

on:
  push:
    branches: [ net10 ]
  pull_request:
    branches: [ net10 ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    defaults:
      run:
        working-directory: ./templates
    steps:
      - uses: actions/checkout@v4
      - name: 设置dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: 还原NuGet包
        run: dotnet restore
      - name: 还原脚手架项目
        run: |
          dotnet restore ConsoleApp/src/ConsoleApp.csproj
          dotnet restore ZStackWebApi/src/ZStackWebApi.csproj
      - name: 编译
        run: dotnet build --configuration Release --no-restore
      - name: 编译脚手架项目
        run: |
          dotnet build ConsoleApp/src/ConsoleApp.csproj --configuration Release --no-restore
          dotnet build ZStackWebApi/src/ZStackWebApi.csproj --configuration Release --no-restore
      - name: 测试
        run: dotnet test --configuration Release --no-restore --no-build --verbosity normal
      - name: 打包
        run: dotnet pack --no-restore --no-build --configuration Release --output nupkgs
      - name: 验证模板
        run: pwsh ./validate-templates.ps1
